<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Boda Minimalista</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Parisienne&family=Playfair+Display:ital@1&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', serif;
            background: linear-gradient(to bottom, #f8f9fc 0%, #e9ecef 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #4a6572;
            overflow-x: hidden;
        }

        h1 {
            font-family: 'Parisienne', cursive;
            font-size: 3.5rem;
            color: #7ea0b8;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 2px;
        }

        /* Contenedor principal */
        .scene {
            position: relative;
            width: 360px;
            height: 240px;
            margin-bottom: 40px;
            z-index: 10;
            perspective: 1000px;
        }

        /* Sobre cerrado */
        .envelope {
            position: absolute;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 20;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }

        /* Cuerpo del sobre */
        .envelope-body {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #ffffff 0%, #e6eef7 100%);
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            z-index: 2;
            overflow: hidden;
            border: 1px solid #d1e0ee;
        }

        .envelope-body:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                repeating-linear-gradient(45deg,
                    transparent,
                    transparent 8px,
                    rgba(126, 160, 184, 0.03) 8px,
                    rgba(126, 160, 184, 0.03) 10px);
        }

        /* Solapa del sobre */
        .flap {
            position: absolute;
            top: -5px;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(to bottom, #f7fafd 0%, #e1ecf6 100%);
            clip-path: polygon(0 0, 50% 100%, 100% 0);
            transform-origin: top;
            transition: transform 1s ease;
            z-index: 3;
            border-radius: 6px 6px 0 0;
            border-bottom: 1px solid #c9ddec;
        }

        .envelope.open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        /* Sello */
        .seal {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #a8c6df 0%, #7ea0b8 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Parisienne', cursive;
            font-size: 0.9rem;
            text-align: center;
            z-index: 4;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: all 0.4s ease;
            line-height: 1.2;
        }

        .seal:hover {
            transform: translateX(-50%) scale(1.05);
        }

        /* Nota visible dentro del sobre */
        .note-inside {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 290px;
            height: 180px;
            background: #ffffff;
            border-radius: 4px;
            z-index: 1;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 1.2s ease 0.5s;
            overflow: hidden;
            border: 1px solid #e1ecf6;
        }

        .note-inside:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(to right, #a8c6df 0%, #7ea0b8 100%);
        }

        .note-inside p {
            font-size: 1.3rem;
            color: #7ea0b8;
            text-align: center;
            padding: 20px;
            font-family: 'Dancing Script', cursive;
            font-weight: bold;
        }

        /* Nota que se desliza hacia arriba */
        .note-slide {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 0;
            transition: height 1s ease 0.6s;
            z-index: 30;
            overflow: hidden;
        }

        .envelope.open~.note-slide {
            height: 380px;
        }

        .note {
            background: #ffffff;
            padding: 25px;
            border-radius: 6px;
            width: 100%;
            height: 380px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            border: 1px solid #e1ecf6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .note:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            background: linear-gradient(to right, #a8c6df 0%, #7ea0b8 100%);
            border-radius: 6px 6px 0 0;
        }

        .note h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #7ea0b8;
            font-family: 'Parisienne', cursive;
            font-size: 2rem;
            font-weight: bold;
            margin-top: 5px;
        }

        .note p {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
            line-height: 1.5;
            font-family: 'Dancing Script', cursive;
            font-weight: bold;
            color: #7ea0b8;
        }

        /* Formulario */
        .form-group {
            margin-bottom: 20px;
            width: 100%;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #7ea0b8;
            font-family: 'Dancing Script', cursive;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1e0ee;
            border-radius: 4px;
            font-size: 1rem;
            font-family: 'Playfair Display', serif;
            background: #f8fafd;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #a8c6df;
            box-shadow: 0 0 0 2px rgba(168, 198, 223, 0.2);
        }

        button {
            background: linear-gradient(to right, #a8c6df 0%, #7ea0b8 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.1rem;
            font-family: 'Dancing Script', cursive;
            font-weight: bold;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .instructions {
            text-align: center;
            margin-top: 30px;
            color: #7ea0b8;
            font-family: 'Dancing Script', cursive;
            font-size: 1.4rem;
            font-weight: bold;
            max-width: 500px;
            line-height: 1.5;
        }

        .heart {
            display: inline-block;
            color: #a8c6df;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: 1.4rem;
            color: #7ea0b8;
            font-weight: bold;
            max-width: 600px;
            line-height: 1.5;
        }

        .couple-names {
            font-family: 'Parisienne', cursive;
            font-size: 1.8rem;
            color: #a8c6df;
            text-align: center;
            margin: 15px 0;
            font-weight: bold;
        }

        .minimal-decoration {
            position: absolute;
            width: 80px;
            height: 80px;
            opacity: 0.1;
            z-index: 0;
            color: #7ea0b8;
        }

        .decoration-1 {
            top: 20px;
            left: 20px;
        }

        .decoration-2 {
            bottom: 20px;
            right: 20px;
        }
    </style>
</head>

<body>
    <!-- Decoraciones minimalistas -->
    <i class="fas fa-heart minimal-decoration decoration-1"></i>
    <i class="fas fa-heart minimal-decoration decoration-2"></i>

    <h1>Invitación de Boda</h1>

    <div class="scene">
        <!-- Sobre -->
        <div class="envelope">
            <!-- Cuerpo del sobre -->
            <div class="envelope-body"></div>

            <!-- Solapa del sobre -->
            <div class="flap"></div>

            <!-- Sello central -->
            <div class="seal">Abrir<br>invitación</div>

            <!-- Nota visible dentro del sobre -->
            <div class="note-inside">
                <p>¡Abrir para confirmar asistencia!</p>
            </div>
        </div>

        <!-- Nota que se deslizará hacia arriba -->
        <div class="note-slide">
            <div class="note">
                <div class="couple-names">Agustin & Sandra</div>
                
                <p>Por favor ingresa<br> tu nombre</p>

                <form id="nombre-form">
                    <div class="form-group">
                        <label for="nombre">Nombre y Apellido:</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Ingresa Nombre y Apellido">
                    </div>
                    <button type="submit">Ingresar</button>
                </form>
            </div>
        </div>
    </div>

    <p class="instructions">Haz clic en el sello <span class="heart">❤</span> para abrir la invitación</p>


    <script>
document.addEventListener('DOMContentLoaded', function() {
    const envelope = document.querySelector('.envelope');
    const seal = document.querySelector('.seal');
    const form = document.getElementById('nombre-form');
    
    seal.addEventListener('click', openEnvelope);
    envelope.addEventListener('click', function(e) {
        if (e.target === envelope) {
            openEnvelope();
        }
    });

    function openEnvelope() {
        if (!envelope.classList.contains('open')) {
            envelope.classList.add('open');
            document.querySelector('.instructions').textContent = 'Completa tus datos para confirmar';
        }
    }

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const nombre = document.getElementById('nombre').value.trim();

        if (nombre === '') {
            alert('Por favor, ingrese su nombre');
            return;
        }

        // Enviar el nombre al servidor para verificar en el CSV
        const response = await fetch('verificarNombre.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'nombre=' + encodeURIComponent(nombre)
        });

        const result = await response.text();

        if (result === 'OK') {
            window.location.href = "home.html";
        } else {
            alert('Lo sentimos, tu nombre no está en la lista de invitados.');
        }
    });
});
</script>

</body>

</html>
