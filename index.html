<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta de invitacion</title>
    <link rel="icon" href="img/logo.png" type="image/png">
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Parisienne&family=Playfair+Display:ital@1&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style/styleIndex.css">
</head>

<body>
    <h1>Invitación de Boda</h1>

    <div class="scene">
        <div class="envelope">
            <div class="envelope-body"></div>
            <div class="flap"></div>
            <div class="seal">Abrir<br>invitación</div>
            <div class="note-inside">
                <p>¡Abrir para confirmar asistencia!</p>
            </div>
        </div>

        <div class="note-slide">
            <div class="note">
                <div class="couple-names">Agustin & Sandra</div>
                
                <p>Por favor ingresa tu primer<br>nombre y primer apellido</p> 

                <form id="nombre-form">
                    <div class="form-group">
                        <label for="nombre">Nombre & Apellido:</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Ingresa tu nombre completo">
                    </div>
                    <button type="submit">Ingresar</button>
                </form>
            </div>
        </div>
    </div>

    <p class="instructions">Haz clic en el sello <span class="heart">❤</span> para abrir la invitación</p>

    <script src="script/scriptNombres.js" ></script>
</body>

</html>
